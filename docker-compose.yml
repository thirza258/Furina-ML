# Furina ML -- the whole application in three containers.
#
#   docker compose up -d --build      then open http://localhost:8080
#
# Per-student notebook servers are opt-in: COMPOSE_PROFILES=hub in `.env` adds
# JupyterHub, a restricted Docker API proxy and the student notebook image
# (see the "notebooks" section of .env.example and README.md).
#
# Every value below has a working default, so a bare `docker compose up` runs
# without a `.env` file. Copy `.env.example` to `.env` before exposing this to
# anything but your own machine -- SECRET_KEY and POSTGRES_PASSWORD in
# particular.

name: furina-ml

services:
  # ---------------------------------------------------------------- database
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-furinaml}
      POSTGRES_USER: ${POSTGRES_USER:-furinaml}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-furinaml}
      # Postgres refuses to initialise into a non-empty directory; giving it a
      # subdirectory of the volume keeps `lost+found` and friends out of the way.
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-furinaml} -d ${POSTGRES_DB:-furinaml}"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  # ----------------------------------------------------------------- the API
  backend:
    build:
      context: ./backend
    environment:
      # Production posture: Postgres instead of SQLite, no debug pages.
      DEVELOPMENT_MODE: "False"
      DEBUG: ${DJANGO_DEBUG:-False}
      SECRET_KEY: ${SECRET_KEY:-insecure-compose-default-change-me}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-*}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
      USE_X_FORWARDED_PROTO: ${USE_X_FORWARDED_PROTO:-True}
      DATABASE_URL: ${DATABASE_URL:-postgres://${POSTGRES_USER:-furinaml}:${POSTGRES_PASSWORD:-furinaml}@db:5432/${POSTGRES_DB:-furinaml}}
      TIME_ZONE: ${TIME_ZONE:-UTC}
      # The upload ceiling, enforced in core/ml/io.py. nginx below is given the
      # same number, so the two cannot drift apart.
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-52428800}

      # Training is a long, CPU-bound, synchronous request; see
      # backend/gunicorn.conf.py for why these are not the stock values.
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
      GUNICORN_THREADS: ${GUNICORN_THREADS:-4}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-300}

      # ML lifecycle ceilings (lifecycle app). A single training or search job
      # is refused up front when it would exceed these, so one request cannot
      # destabilise the worker. See docs/lifecycle.md.
      FURINA_MAX_TRAIN_ROWS: ${FURINA_MAX_TRAIN_ROWS:-250000}
      FURINA_MAX_TRAIN_COLUMNS: ${FURINA_MAX_TRAIN_COLUMNS:-300}
      FURINA_MAX_HPO_TRIALS: ${FURINA_MAX_HPO_TRIALS:-500}
      FURINA_AUTOML_MAX_ROWS: ${FURINA_AUTOML_MAX_ROWS:-40000}
      # Set to 1 when an external worker owns the queue instead of the
      # in-process poller (for example a dedicated runner container).
      FURINA_DISABLE_JOB_POLLER: ${FURINA_DISABLE_JOB_POLLER:-}

      # The in-app helper. With no key the feature reports itself as off and
      # the button says so; nothing else changes.
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-qwen/qwen3.7-flash}
      # Per-IP ceiling on the one endpoint that spends money.
      ASSISTANT_RATE_LIMIT: ${ASSISTANT_RATE_LIMIT:-20/hour}
      SITE_URL: ${SITE_URL:-https://furina.nevatal.id}

      # Accounts and the notebook server. JUPYTERHUB_URL empty means no hub:
      # lessons then offer only the in-browser JupyterLite preview.
      ACCOUNT_REGISTRATION: ${ACCOUNT_REGISTRATION:-True}
      AUTH_RATE_LIMIT: ${AUTH_RATE_LIMIT:-10/minute}
      JUPYTERHUB_URL: ${JUPYTERHUB_URL:-}
      JUPYTERHUB_OAUTH_CLIENT_ID: ${JUPYTERHUB_OAUTH_CLIENT_ID:-}
      JUPYTERHUB_OAUTH_CLIENT_SECRET: ${JUPYTERHUB_OAUTH_CLIENT_SECRET:-}
      # JupyterHub calls the OAuth token and user endpoints at backend:8000.
      INTERNAL_HOSTS: backend
      # Client addresses for rate limits come from nginx's X-Forwarded-For.
      NUM_PROXIES: ${NUM_PROXIES:-1}
      # Automated grading (profile: grader). The grader worker authenticates
      # with this shared secret; empty turns grading off.
      GRADER_TOKEN: ${GRADER_TOKEN:-}
      SUBMISSION_RATE_LIMIT: ${SUBMISSION_RATE_LIMIT:-30/hour}

      # Optional: create an /admin/ login on first boot.
      DJANGO_SUPERUSER_USERNAME: ${DJANGO_SUPERUSER_USERNAME:-}
      DJANGO_SUPERUSER_EMAIL: ${DJANGO_SUPERUSER_EMAIL:-}
      DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD:-}
    volumes:
      # Uploaded CSVs and fitted .joblib pipelines. This is application state
      # that the database rows point at -- losing it leaves rows referencing
      # files that no longer exist, so it has to outlive the container.
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # ------------------------------------------------- the SPA and the front door
  frontend:
    build:
      context: ./frontend
      # The JupyterLite preview is built from the course notebooks.
      additional_contexts:
        notebooks: ./notebooks
    environment:
      # Where nginx forwards /api, /admin and /static.
      BACKEND_ORIGIN: ${BACKEND_ORIGIN:-backend:8000}
      # What the browser bundle calls. Same origin by default, so no CORS.
      API_BASE_URL: ${API_BASE_URL:-/api}
      # client_max_body_size. nginx takes a plain byte count, so this is the
      # very same value the backend is given -- one number, no drift.
      MAX_UPLOAD_SIZE: ${MAX_UPLOAD_BYTES:-52428800}
      PROXY_TIMEOUT: ${PROXY_TIMEOUT:-300s}
      # Public origin for the canonical link, Open Graph tags and the sitemap.
      SITE_URL: ${SITE_URL:-https://furina.nevatal.id}
      # When set, nginx also answers for the hub's host name and every
      # student subdomain under it, and forwards them to JupyterHub.
      JUPYTERHUB_URL: ${JUPYTERHUB_URL:-}
      JUPYTERHUB_ORIGIN: ${JUPYTERHUB_ORIGIN:-jupyterhub:8000}
      # owner/repo/blob/branch/notebooks on GitHub: shows "Open in Colab" on
      # lesson notebooks. Leave empty unless that repository is public.
      NOTEBOOKS_GITHUB: ${NOTEBOOKS_GITHUB:-}
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # ------------------------------------------- notebooks (profile: hub)
  # One isolated notebook server per signed-in student. Off by default; see
  # the notebooks section of .env.example before turning it on.
  jupyterhub:
    build:
      context: ./jupyter/hub
    profiles: ["hub"]
    environment:
      SITE_URL: ${SITE_URL:-https://furina.nevatal.id}
      JUPYTERHUB_URL: ${JUPYTERHUB_URL:-}
      JUPYTERHUB_OAUTH_CLIENT_ID: ${JUPYTERHUB_OAUTH_CLIENT_ID:-}
      JUPYTERHUB_OAUTH_CLIENT_SECRET: ${JUPYTERHUB_OAUTH_CLIENT_SECRET:-}
      # Encrypts the stored OAuth tokens. `openssl rand -hex 32`.
      JUPYTERHUB_CRYPT_KEY: ${JUPYTERHUB_CRYPT_KEY:-}
      NOTEBOOK_IMAGE: ${NOTEBOOK_IMAGE:-furina-notebook:latest}
      NOTEBOOK_MEM_LIMIT: ${NOTEBOOK_MEM_LIMIT:-1G}
      NOTEBOOK_CPU_LIMIT: ${NOTEBOOK_CPU_LIMIT:-1}
      NOTEBOOK_PIDS_LIMIT: ${NOTEBOOK_PIDS_LIMIT:-256}
      NOTEBOOK_IDLE_SECONDS: ${NOTEBOOK_IDLE_SECONDS:-1800}
    volumes:
      # The hub's own database and cookie secret. Student files are in
      # per-student volumes named furina-nb-u<id>, created on first start.
      - hub_data:/srv/jupyterhub/data
    networks: [default, students, docker-api]
    depends_on:
      backend:
        condition: service_healthy
      docker-proxy:
        condition: service_started
      notebook-image:
        condition: service_completed_successfully
    restart: unless-stopped

  # The hub's and the grader's only way to Docker: container and image calls,
  # nothing else (no exec, no builds, no swarm). Not reachable from student
  # containers. Mounting the socket still makes this -- and its two clients --
  # privileged.
  docker-proxy:
    image: tecnativa/docker-socket-proxy:v0.4.2
    profiles: ["hub", "grader"]
    environment:
      CONTAINERS: 1
      IMAGES: 1
      POST: 1
      ALLOW_START: 1
      ALLOW_STOP: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [docker-api]
    restart: unless-stopped

  # Builds the student notebook image; it is started by the hub (and run by
  # the grader as a sandbox), never here.
  notebook-image:
    build:
      context: ./jupyter/singleuser
      additional_contexts:
        notebooks: ./notebooks
    image: ${NOTEBOOK_IMAGE:-furina-notebook:latest}
    profiles: ["hub", "grader"]
    entrypoint: ["true"]
    network_mode: none
    restart: "no"

  # ------------------------------------------ grading (profile: grader)
  # Grades submitted lesson notebooks: each one runs in a throwaway container
  # of the student image with no network. Needs GRADER_TOKEN, shared with the
  # backend. Works with or without the hub profile.
  grader:
    build:
      context: ./jupyter/grader
      additional_contexts:
        notebooks: ./notebooks
    profiles: ["grader"]
    environment:
      GRADER_TOKEN: ${GRADER_TOKEN:-}
      GRADER_API_URL: http://backend:8000/api
      GRADER_IMAGE: ${NOTEBOOK_IMAGE:-furina-notebook:latest}
      GRADER_CELL_TIMEOUT: ${GRADER_CELL_TIMEOUT:-60}
      GRADER_TIMEOUT: ${GRADER_TIMEOUT:-300}
      GRADER_MEM_LIMIT: ${GRADER_MEM_LIMIT:-1g}
      GRADER_CPU_LIMIT: ${GRADER_CPU_LIMIT:-1}
      DOCKER_HOST: tcp://docker-proxy:2375
    networks: [default, docker-api]
    depends_on:
      backend:
        condition: service_healthy
      docker-proxy:
        condition: service_started
      notebook-image:
        condition: service_completed_successfully
    restart: unless-stopped

networks:
  default: {}
  # Student servers live here: internal, so no route to the internet, the
  # host, the database or the Furina API -- only to the hub.
  students:
    name: furina-students
    internal: true
  docker-api:
    internal: true

volumes:
  db_data:
  media_data:
  hub_data:
